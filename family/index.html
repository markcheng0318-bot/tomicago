<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>家族聚會報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 給長輩用手機填寫：單一淺色主題、深色字、強對比，字放大，按鈕至少 48px 高。
   手機一欄由上往下操作；電腦版後台才放寬成表格。 */
:root {
  color-scheme: light;
  --paper: #f5f6f8;        /* 頁面底色：很淡的灰，不刺眼 */
  --surface: #ffffff;      /* 卡片 */
  --ink: #161a20;          /* 主要文字：接近黑 */
  --muted: #3f4652;        /* 次要文字：仍保持 9:1 以上對比 */
  --line: #c9ced6;
  --blue: #1b4f9c; --blue-soft: #e6eefb; --on-blue: #ffffff;
  --meat: #a3321c; --meat-soft: #fbe9e4;
  --veg: #2c6a1d; --veg-soft: #e5f2dd;
  --share: #7f5200; --share-soft: #fbf0d9;
  --off: #4a515c; --off-soft: #eceef1;
  --warn: #7a4300; --warn-soft: #fff1d1;
  --ok: #1f6a2c; --ok-soft: #e3f4e5;
  --bad: #a3231c; --bad-soft: #fde6e4;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 18px; line-height: 1.7;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px }
[hidden] { display: none !important }
.wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 16px }
.wrap.wide { max-width: 1100px }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; text-wrap: balance; font-weight: 700 }
h1 { font-size: 1.5rem } h2 { font-size: 1.3rem } h3 { font-size: 1.2rem } h4 { font-size: 1.05rem }
p { margin: 0 }
.muted { color: var(--muted) }
.small { font-size: .9rem }
.num { font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px }
a { color: var(--blue) }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 3px solid var(--blue) }
header.top h1 { color: var(--blue) }
.seg { display: inline-flex; border: 2px solid var(--blue); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px }
.seg button { border: 0; background: none; min-height: 40px; padding: 4px 16px; border-radius: 999px; font-weight: 700; color: var(--blue) }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue) }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 14px; min-width: 0; box-shadow: 0 1px 2px rgba(22, 26, 32, .06) }
.ev-head { display: grid; gap: 8px }
.ev-head h2 { font-size: 1.45rem }
.meta { display: grid; gap: 2px; font-size: 1rem }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 12px; border-radius: 999px; font-size: .9rem; font-weight: 700; white-space: nowrap; border: 1px solid transparent }
.pill.open { background: var(--veg-soft); color: var(--veg); border-color: var(--veg) }
.pill.closed { background: var(--off-soft); color: var(--off); border-color: var(--off) }
.pill.done { background: var(--blue-soft); color: var(--blue); border-color: var(--blue) }
.pill.todo { background: var(--warn-soft); color: var(--warn); border-color: var(--warn) }
.pill.adm { background: var(--share-soft); color: var(--share); border-color: var(--share) }
.pill.meal { background: var(--meat-soft); color: var(--meat); border-color: var(--meat) }
.pinned { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--r); background: var(--blue-soft); border: 2px solid var(--blue); font-size: 1rem }
.pinned b { font-size: 1.1rem; color: var(--blue) }
.banner { padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); font-weight: 500 }
.banner.info { background: var(--blue-soft); color: var(--blue); border-color: var(--blue) }

.label { font-size: 1rem; font-weight: 700; color: var(--muted) }
h2.sec { font-size: 1.2rem }
h2.step { display: flex; align-items: center; gap: 10px; font-size: 1.25rem }
.step-no { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: var(--on-blue); display: grid; place-items: center; font-size: 1.1rem }

/* 選家庭：手機兩欄大按鈕，選到的有粗框和勾勾 */
.fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.fam { position: relative; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; min-height: 84px; text-align: left; display: grid; gap: 6px; align-content: start; min-width: 0 }
.fam b { font-size: 1.2rem; overflow-wrap: anywhere }
.fam .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted) }
.fam[aria-pressed="true"] { border: 3px solid var(--blue); background: var(--blue-soft); padding: 11px 13px }
.fam[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 10px; color: var(--blue); font-weight: 700; font-size: 1.3rem }

.members { display: flex; flex-wrap: wrap; gap: 8px }
.chip { padding: 4px 12px; border-radius: 999px; background: var(--off-soft); font-size: .95rem; border: 1px solid var(--line) }
.chip.kid { background: var(--share-soft); color: var(--share); border-color: var(--share) }

.block { display: grid; gap: 12px; padding-top: 16px; border-top: 2px dashed var(--line) }
.block-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }

/* 大人葷素：大大的 ＋ － 按鈕 */
.steppers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--surface) }
.stepper .name { font-weight: 700; font-size: 1.15rem }
.stepper.meat { border-color: var(--meat) } .stepper.meat .name { color: var(--meat) }
.stepper.veg { border-color: var(--veg) } .stepper.veg .name { color: var(--veg) }
.stepper .ctl { display: flex; align-items: center; gap: 8px }
.stepper .ctl button { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); font-size: 1.6rem; font-weight: 700; line-height: 1 }
.stepper .ctl button:active { background: var(--blue-soft) }
.stepper .ctl button:disabled { opacity: .3; cursor: default }
.stepper .val { min-width: 2ch; text-align: center; font-size: 1.8rem; font-weight: 700 }
.absent-note { font-size: 1rem; color: var(--muted); font-weight: 500 }

/* 小朋友：四個選項排成兩排兩欄的大按鈕 */
.kid-row { display: grid; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line) }
.kid-row:first-of-type { border-top: 0 }
.kid-row .who { font-weight: 700; font-size: 1.1rem }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
@media (min-width: 640px) { .opts { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 52px; padding: 8px 10px; font-size: 1.05rem; font-weight: 500 }
.opt[aria-pressed="true"] { font-weight: 700; color: var(--on-blue) }
.opt[aria-pressed="true"]::before { content: "✓ " }
.opt[aria-pressed="true"].meat { background: var(--meat); border-color: var(--meat) }
.opt[aria-pressed="true"].veg { background: var(--veg); border-color: var(--veg) }
.opt[aria-pressed="true"].share { background: var(--share); border-color: var(--share) }
.opt[aria-pressed="true"].absent { background: var(--off); border-color: var(--off) }

textarea, input[type=text], input[type=email], input[type=date], input[type=time], input[type=number], select { width: 100%; min-height: 50px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; font-size: 1.05rem }
textarea:focus, input:focus, select:focus { border-color: var(--blue); outline: none }
textarea { min-height: 90px; resize: vertical }

.tally { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1.05rem; padding: 10px 14px; background: var(--off-soft); border-radius: 12px }
.tally b { font-size: 1.25rem }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 48px; padding: 8px 18px; font-weight: 700; font-size: 1rem }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue) }
.btn.danger { color: var(--bad); border-color: var(--bad) }
.btn.ghost { border-color: transparent; background: none; color: var(--blue); padding-inline: 8px; text-decoration: underline; text-underline-offset: 3px }
.btn.back { padding-inline: 0; font-size: 1.1rem; text-decoration: none }
.btn.big { width: 100%; min-height: 58px; font-size: 1.2rem }
.btn:disabled { opacity: .45; cursor: default }
.saved { color: var(--ok); font-weight: 700 }
.err { color: var(--bad); font-weight: 700 }

/* 送出按鈕固定在畫面下方，填到一半也看得到 */
.submit-bar { position: sticky; bottom: 0; z-index: 5; display: grid; gap: 8px; margin: 0 -16px -18px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 2px solid var(--line); border-radius: 0 0 var(--r) var(--r); box-shadow: 0 -6px 16px rgba(22, 26, 32, .08) }
.notice { padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 1.05rem }
.submit-bar .notice { padding: 6px 12px; font-size: 1rem; text-align: center }
.notice.ok { background: var(--ok-soft); color: var(--ok); border: 2px solid var(--ok) }
.notice.bad { background: var(--bad-soft); color: var(--bad); border: 2px solid var(--bad) }
.notice.warn { background: var(--warn-soft); color: var(--warn); border: 2px solid var(--warn) }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px }
.tile { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--surface) }
.tile .k { font-size: .95rem; color: var(--muted); font-weight: 700 }
.tile .v { font-size: 1.9rem; font-weight: 700; line-height: 1.2 }
.tile .s { font-size: .9rem; color: var(--muted) }
.tile.meat .v { color: var(--meat) } .tile.veg .v { color: var(--veg) } .tile.share .v { color: var(--share) } .tile.main .v { color: var(--blue) }
.tiles.compact .tile { padding: 8px 12px }
.tiles.compact .tile .v { font-size: 1.45rem }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .95rem }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap }
td.wrap-cell { white-space: normal; min-width: 160px; max-width: 280px }
td.meal-cell { white-space: normal; min-width: 100px }
th { font-size: .9rem; color: var(--ink); font-weight: 700; background: var(--off-soft) }
th.grp { text-align: center; border-left: 1px solid var(--line) }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums }
td.bl, th.bl { border-left: 1px solid var(--line) }
tr.total td { font-weight: 700; background: var(--off-soft) }
tr.pending td { color: var(--muted) }

.list { display: grid; gap: 10px }
.li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.li .main { min-width: 0; display: grid; gap: 2px }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.field { display: grid; gap: 6px; min-width: 0 }
.field span { font-size: 1rem; font-weight: 700 }
.geo-box { position: absolute; z-index: 50; background: var(--surface); border: 2px solid var(--blue); border-radius: 12px; box-shadow: 0 8px 24px rgba(22, 26, 32, .18); overflow: hidden; display: grid }
.geo-item { display: grid; gap: 2px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 10px 14px; min-height: 52px }
.geo-item:hover, .geo-item:focus { background: var(--blue-soft) }
.geo-item b { font-size: 1.05rem }
.geo-item span { font-size: .9rem; color: var(--muted) }
.geo-by { padding: 6px 14px; font-size: .8rem; color: var(--muted); text-align: right; background: var(--off-soft) }
.places { display: grid; gap: 12px; padding: 14px; border: 2px dashed var(--blue); border-radius: var(--r); background: var(--surface) }
.place-row { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line) }
.editor { border: 2px solid var(--blue); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; background: var(--blue-soft) }
.log { display: grid; gap: 4px; font-size: .95rem; color: var(--muted) }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 8px }
.empty b { color: var(--ink); font-size: 1.15rem }

/* 活動卡片：手機一欄、整張可以點 */
.ev-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px }
.ev-card { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; min-width: 0 }
.ev-card:hover, .ev-card:active { border-color: var(--blue) }
.ev-card b { font-size: 1.3rem; overflow-wrap: anywhere }
.ev-card-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 1rem }
.ev-card-go { display: block; margin-top: 4px; padding: 12px; border-radius: 12px; background: var(--blue); color: var(--on-blue); font-weight: 700; text-align: center; font-size: 1.05rem }
.c-meat { color: var(--meat) } .c-veg { color: var(--veg) } .c-share { color: var(--share) }

.addr { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 1rem; overflow-wrap: anywhere }
.addr span { width: 100% }

/* 行程時間軸 */
.plan { list-style: none; margin: 0; padding: 0; display: grid }
.plan-item { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 14px 0; border-top: 2px dashed var(--line) }
.plan-item:first-child { border-top: 0; padding-top: 4px }
.plan-item.editing { grid-template-columns: 1fr }
.plan-when { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 700; font-size: 1.05rem }
.plan-body { display: grid; gap: 4px; min-width: 0 }
.plan-body b { font-size: 1.15rem; overflow-wrap: anywhere }
@media (max-width: 520px) { .plan-item { grid-template-columns: 1fr; gap: 2px } }

/* 每一餐的填寫區 */
.unit { border: 2px solid var(--meat); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; background: var(--surface) }
.unit-head { display: grid; gap: 8px; padding-bottom: 10px; border-bottom: 2px solid var(--meat-soft) }
.unit-head h3 { font-size: 1.25rem; color: var(--meat) }
.unit-head .actions .btn { flex: 1 1 auto; border: 2px solid var(--line); text-decoration: none; background: var(--surface); color: var(--ink) }

@media (max-width: 520px) {
  .card { padding: 16px 14px }
  .submit-bar { margin: 0 -14px -16px; padding-inline: 14px }
  .steppers { grid-template-columns: 1fr }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (prefers-reduced-motion: no-preference) { .fam, .opt, .btn, .ev-card { transition: background .15s, border-color .15s } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top"><div class="brand"><h1>家族聚會報名</h1></div></header>
  <div class="empty"><b>正在載入資料…</b><span>載入家庭名單與活動中</span></div>
</div>
<script>
// 資料都存在 Google 試算表，透過 Apps Script 的 JSON 介面讀寫（不帶 Cookie，多個 Google 帳號登入也能用）
const API_URL = "https://script.google.com/macros/s/AKfycbzZ6oisCjdjfXlMCv771vnceyQwfWGfUP0kJlYkT2UY65yZ8vJj21F5452BEmmgX_Pm/exec";
const ADMIN_KEY = new URLSearchParams(location.search).get("admin") || "";
const PUBLIC_URL = location.origin + location.pathname;
// Google 地圖金鑰：只限 tomicago.com 使用，只在後台輸入地點時載入
const MAPS_KEY = "AIzaSyCBvYG8bsAIwKpCNcY2098oAXTac7uCiCg";
(() => {
const KID_OPTS = [["meat", "葷食餐"], ["veg", "素食餐"], ["share", "與家長共食"], ["absent", "不參加"]];
const KIND = { meal: "聚餐", trip: "旅遊" };
const S = {
  ready: false, loadErr: null, isOwner: !!ADMIN_KEY,
  families: [], events: [], items: [], responses: new Map(),
  view: "fill", eventId: null, familyId: null,
  draft: null, saving: false, busy: false, msg: null,
  famForm: null, evForm: null, itForm: null, adminEvent: null, fillEvent: null, bulk: "", confirm: null, adminMsg: null, exportUrl: null,
};
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
S.eventId = store.get("rsvp.event"); S.familyId = store.get("rsvp.family");
if (S.isOwner && store.get("rsvp.view") === "admin") S.view = "admin";

const api = async (fn, ...args) => {
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "伺服器沒有回應，請稍後再試。");
  return j.data;
};
const errText = e => (e && e.message ? String(e.message).replace(/^Error:\s*/, "").replace(/^Exception:\s*/, "") : "連線失敗，請稍後再試一次。");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = s => String(s || "").replace(/^\d{4}\//, "");
const mapsUrl = a => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a);
const fmtDate = s => s ? s.replace(/^(\d{4})-0?(\d+)-0?(\d+)$/, "$1/$2/$3") : "";
const fmtDay = s => s ? s.replace(/^\d{4}-0?(\d+)-0?(\d+)$/, "$1/$2") : "";
const adults = f => (f.members || []).filter(m => m.kind === "adult");
const kids = f => (f.members || []).filter(m => m.kind === "child");
const respKey = (eid, fid) => `${eid}__${fid}`;
const curEvent = () => S.events.find(e => e.id === S.eventId) || null;
const curFamily = () => S.families.find(f => f.id === S.familyId) || null;
const openFams = () => S.families.filter(f => !f.fixed);
// 行程依「排序」排好；「餐廳」類型的行程要家人回報那一餐的人數
const itemsOf = ev => S.items.filter(i => i.eventId === ev.id).sort((a, b) => a.order - b.order);
const mealsOf = ev => itemsOf(ev).filter(i => i.kind === "meal");
const unitIds = ev => { const m = mealsOf(ev); return m.length ? m.map(x => x.id) : ["_"]; };
const whenText = (date, time) => [fmtDay(date), time].filter(Boolean).join(" ");
const dateRange = ev => fmtDate(ev.date) + (ev.endDate && ev.endDate > ev.date ? " – " + fmtDay(ev.endDate) : "");

// 某家庭在某一餐（meal 為 null 表示整個活動就是一餐）的選擇；固定名額的家庭每一餐都自動算進去
function choiceFor(ev, f, meal) {
  if (f.fixed) return { adultsMeat: f.fixed.adultsMeat || 0, adultsVeg: f.fixed.adultsVeg || 0, kids: {}, fixed: true };
  const r = S.responses.get(respKey(ev.id, f.id));
  if (!r) return null;
  return meal ? (r.meals?.[meal.id] || null) : r;
}

// ---------- tallies ----------
function tallyFamily(f, c) {
  const A = adults(f).length, K = kids(f);
  const t = { adults: A, kidsTotal: K.length, aMeat: 0, aVeg: 0, aOff: A, kMeat: 0, kVeg: 0, kShare: 0, kOff: 0, kUnset: 0, responded: !!c };
  if (!c) return t;
  t.aMeat = Math.min(c.adultsMeat || 0, A); t.aVeg = Math.min(c.adultsVeg || 0, A - t.aMeat); t.aOff = A - t.aMeat - t.aVeg;
  for (const k of K) {
    const v = c.kids?.[k.id];
    if (v === "meat") t.kMeat++; else if (v === "veg") t.kVeg++; else if (v === "share") t.kShare++; else if (v === "absent") t.kOff++; else t.kUnset++;
  }
  return t;
}
const people = t => t.aMeat + t.aVeg + t.kMeat + t.kVeg + t.kShare;
function tallyUnit(ev, meal) {
  const rows = S.families.map(f => ({ f, c: choiceFor(ev, f, meal) })).map(x => ({ ...x, t: tallyFamily(x.f, x.c) }));
  const sum = { families: rows.length, responded: 0, aMeat: 0, aVeg: 0, aOff: 0, kMeat: 0, kVeg: 0, kShare: 0, kOff: 0, people: 0 };
  for (const { t } of rows) {
    if (!t.responded) continue;
    sum.responded++;
    for (const k of ["aMeat", "aVeg", "aOff", "kMeat", "kVeg", "kShare", "kOff"]) sum[k] += t[k];
    sum.people += people(t);
  }
  sum.meat = sum.aMeat + sum.kMeat; sum.veg = sum.aVeg + sum.kVeg;
  sum.tables = Math.ceil(sum.people / (Number(meal ? meal.seats : ev.seats) || 10));
  return { rows, sum };
}
// 有沒有回覆以「整個活動」為單位：送出過一次就算已填
const respondedOf = (ev, f) => !!(f.fixed || S.responses.get(respKey(ev.id, f.id)));
const respondedCount = ev => S.families.filter(f => respondedOf(ev, f)).length;

// ---------- draft ----------
const blankUnit = f => ({ adultsMeat: adults(f).length, adultsVeg: 0, kids: Object.fromEntries(kids(f).map(k => [k.id, null])) });
function syncDraft(force) {
  const ev = curEvent(), f = curFamily();
  if (!ev || !f) { S.draft = null; return }
  const key = respKey(ev.id, f.id);
  if (!force && S.draft && S.draft.key === key && S.draft.dirty) return;
  const r = S.responses.get(key);
  const units = {};
  for (const id of unitIds(ev)) {
    const src = r ? (id === "_" ? r : r.meals?.[id]) : null;
    const u = blankUnit(f);
    if (src) {
      u.adultsMeat = Math.min(src.adultsMeat || 0, adults(f).length);
      u.adultsVeg = Math.min(src.adultsVeg || 0, adults(f).length - u.adultsMeat);
      for (const k of kids(f)) u.kids[k.id] = src.kids?.[k.id] || null;
    }
    units[id] = u;
  }
  const who = store.get("rsvp.who") || "", email = S.isOwner ? (r?.email || "") : (store.get("rsvp.email") || "");
  S.draft = { key, units, note: r?.note || "", who, email, dirty: false };
}

// ---------- render ----------
function render() {
  const app = document.getElementById("app");
  const act = document.activeElement, focusId = act && act.id, selS = act?.selectionStart, selE = act?.selectionEnd;
  app.className = "wrap" + (S.view === "admin" ? " wide" : "");
  geoClose();
  app.innerHTML = renderHeader() + renderBody();
  if (focusId) { const n = document.getElementById(focusId); if (n) { n.focus(); try { if (selS != null) n.setSelectionRange(selS, selE) } catch {} } }
}

function renderHeader() {
  const tabs = S.isOwner ? `<div class="seg" role="group" aria-label="切換畫面">
    <button data-act="view" data-v="fill" aria-pressed="${S.view === "fill"}">填寫</button>
    <button data-act="view" data-v="admin" aria-pressed="${S.view === "admin"}">後台</button></div>` : "";
  return `<header class="top"><div class="brand"><h1>家族聚會報名</h1></div>
    ${tabs}</header>`;
}

function renderBody() {
  if (S.loadErr && !S.ready) return `<div class="card empty"><b>資料載入失敗</b><span>${esc(S.loadErr)}</span><span><button class="btn" data-act="refresh">再試一次</button></span></div>`;
  if (!S.ready) return `<div class="empty"><b>正在載入資料…</b><span>載入家庭名單與活動中</span></div>`;
  return fixedBanner() + (S.view === "admin" && S.isOwner ? renderAdmin() : renderFill());
}

function fixedBanner() {
  return S.families.filter(f => f.fixed).map(f => {
    const m = f.fixed.adultsMeat || 0, v = f.fixed.adultsVeg || 0;
    return `<div class="pinned"><b>${esc(f.name)}已經幫大家加進去了</b><span>${adults(f).map(x => esc(x.name)).join("、")}，共 ${m + v} 人（${v} 素、${m} 葷）。這一家不用另外填寫，每次活動（每一餐）都會自動算進總數。</span></div>`;
  }).join("");
}

function eventHead(ev) {
  const late = ev.open && ev.deadline && ev.deadline < new Date().toISOString().slice(0, 10);
  return `<div class="ev-head">
    <div class="actions"><span class="pill ${ev.open ? "open" : "closed"}">${ev.open ? "開放填寫" : "已截止"}</span><span class="pill done">${KIND[ev.kind] || "活動"}</span></div>
    <h2>${esc(ev.title)}</h2>
    <div class="meta">${ev.date ? `<span>日期　${dateRange(ev)}${ev.time ? " " + esc(ev.time) : ""}</span>` : ""}${ev.place ? `<span>地點　${esc(ev.place)}</span>` : ""}${ev.deadline ? `<span>填寫截止　${fmtDate(ev.deadline)}${late ? "（已過）" : ""}</span>` : ""}</div>
    ${ev.address ? addrLine(ev.address, "copy-addr", ev.id) : ""}
    ${ev.desc ? `<p class="muted">${esc(ev.desc).replace(/\n/g, "<br>")}</p>` : ""}</div>`;
}
const addrLine = (address, act, id) => `<div class="addr"><span>地址　${esc(address)}</span><a class="btn ghost" href="${esc(mapsUrl(address))}" target="_blank" rel="noopener">在 Google 地圖開啟</a><button class="btn ghost" data-act="${act}" data-id="${id}">複製地址</button></div>`;

// 行程時間軸：家人看的版本（admin 為 true 時加上排序與編輯按鈕）
function planList(ev, admin) {
  const list = itemsOf(ev);
  if (!list.length) return "";
  return `<ol class="plan">${list.map((it, i) => {
    const confirming = S.confirm === "it:" + it.id;
    const ctl = !admin ? "" : confirming
      ? `<div class="actions"><span class="err">刪除「${esc(it.title)}」？${it.kind === "meal" ? "這一餐的回覆也會一起失效。" : ""}</span><button class="btn danger" data-act="it-del-yes" data-id="${it.id}">確定刪除</button><button class="btn" data-act="confirm-cancel">取消</button></div>`
      : `<div class="actions">
          <button class="btn ghost" data-act="it-move" data-id="${it.id}" data-d="-1" ${i === 0 || S.busy ? "disabled" : ""} aria-label="上移">↑</button>
          <button class="btn ghost" data-act="it-move" data-id="${it.id}" data-d="1" ${i === list.length - 1 || S.busy ? "disabled" : ""} aria-label="下移">↓</button>
          <button class="btn" data-act="it-edit" data-id="${it.id}">編輯</button>
          <button class="btn ghost" data-act="it-del" data-id="${it.id}">刪除</button></div>`;
    if (admin && S.itForm && S.itForm.id === it.id) return `<li class="plan-item editing">${itemForm(S.itForm)}</li>`;
    return `<li class="plan-item">
      <span class="plan-when">${esc(whenText(it.date, it.time)) || `第 ${i + 1} 站`}</span>
      <div class="plan-body">
        <div class="actions"><b>${esc(it.title)}</b><span class="pill ${it.kind === "meal" ? "meal" : "done"}">${it.kind === "meal" ? "用餐" : "行程"}</span></div>
        ${it.place ? `<span class="small muted">${esc(it.place)}</span>` : ""}
        ${it.address ? addrLine(it.address, "copy-it-addr", it.id) : ""}
        ${it.desc ? `<span class="small muted">${esc(it.desc).replace(/\n/g, "<br>")}</span>` : ""}
        ${ctl}
      </div></li>`;
  }).join("")}</ol>`;
}

// ---------- 前台 ----------
// 前台分兩步：先看活動清單，點進某個活動才看到活動資訊與行程，再往下選家庭、填人數餐點
function renderFill() {

}

function renderFillList() {
  if (!S.events.length) return `<div class="card empty"><b>目前還沒有活動</b><span>${S.isOwner ? "到「後台」新增第一個聚餐或旅遊活動。" : "活動建立後就能在這裡報名。"}</span></div>`;
  const cards = S.events.map(e => {

      <b>${esc(e.title)}</b>

  return `<section class="card"><div><h2>選擇活動</h2><p class="small muted">點選要報名的活動，會先看到活動資訊與行程，再往下填寫。</p></div><div class="ev-cards">${cards}</div></section>`;
}

function renderFillEvent(ev) {
  const f = curFamily();
  const back = `<div class="actions"><button class="btn ghost back" data-act="back-list">← 所有活動</button></div>`;
  const plan = planList(ev, false);

  if (!openFams().length) return `${back}${head}<div class="card empty"><b>還沒有家庭名單</b><span>${S.isOwner ? "到「後台 → 家庭名單」新增各家庭與成員。" : "請等候管理員建立家庭名單。"}</span></div>`;

}

// 一餐的填寫區塊：大人葷素份數、每位小朋友的選擇
function unitBlock(f, u, uid, meal, prevId, locked) {
  const A = adults(f), K = kids(f);
  const off = A.length - u.adultsMeat - u.adultsVeg;
  const unset = K.filter(k => !u.kids[k.id]).length;
  const kc = { meat: 0, veg: 0, share: 0, absent: 0 }; K.forEach(k => u.kids[k.id] && kc[u.kids[k.id]]++);
  const total = u.adultsMeat + u.adultsVeg + kc.meat + kc.veg + kc.share;
  const stepper = (cls, label, val, key) => `<div class="stepper ${cls}"><span class="name">${label}</span><span class="ctl">
    <button data-act="adult" data-u="${uid}" data-k="${key}" data-d="-1" ${locked || val <= 0 ? "disabled" : ""} aria-label="${label}減一">−</button>
    <span class="val num">${val}</span>
    <button data-act="adult" data-u="${uid}" data-k="${key}" data-d="1" ${locked || off <= 0 ? "disabled" : ""} aria-label="${label}加一">＋</button></span></div>`;
  const kidRows = K.map(k => `<div class="kid-row"><span class="who">${esc(k.name)}</span><div class="opts" role="group" aria-label="${esc(k.name)}的餐點">
    ${KID_OPTS.map(([v, l]) => `<button class="opt ${v}" data-act="kid" data-u="${uid}" data-id="${k.id}" data-v="${v}" aria-pressed="${u.kids[k.id] === v}" ${locked ? "disabled" : ""}>${l}</button>`).join("")}</div></div>`).join("");
  const body = `
    ${A.length ? `<div class="block-head"><h4>大人（${A.length} 位）</h4><span class="absent-note">${off > 0 ? `${off} 位不出席` : "全員出席"}</span></div>
      <div class="steppers">${stepper("meat", "葷食", u.adultsMeat, "adultsMeat")}${stepper("veg", "素食", u.adultsVeg, "adultsVeg")}</div>` : ""}
    ${K.length ? `<div class="block-head"><h4>小朋友（${K.length} 位）</h4>${unset ? `<span class="pill todo">還有 ${unset} 位未選</span>` : ""}</div>${kidRows}` : ""}
    <div class="tally num"><span>這一餐 <b>${total}</b> 人</span><span class="c-meat">葷食 <b>${u.adultsMeat + kc.meat}</b> 份</span><span class="c-veg">素食 <b>${u.adultsVeg + kc.veg}</b> 份</span>${kc.share ? `<span class="c-share">共食 <b>${kc.share}</b> 位</span>` : ""}</div>`;
  if (!meal) return `<div class="block">${body}
      <p class="small muted">葷＋素的份數就是出席的大人人數；沒算進去的視為不出席。「與家長共食」會算座位，但不另外點餐。</p></div>`;
  return `<div class="unit">
    <div class="unit-head"><div><h3>${esc(meal.title)}</h3><span class="small muted">${[whenText(meal.date, meal.time), meal.place].filter(Boolean).map(esc).join("・")}</span></div>
      <div class="actions">${prevId ? `<button class="btn ghost" data-act="unit-copy" data-u="${uid}" data-from="${prevId}" ${locked ? "disabled" : ""}>跟上一餐一樣</button>` : ""}<button class="btn ghost" data-act="unit-absent" data-u="${uid}" ${locked ? "disabled" : ""}>這一餐不參加</button></div></div>
    ${body}</div>`;
}

function renderForm(ev, f) {
  const d = S.draft; if (!d) return "";
  const r = S.responses.get(d.key);
  const locked = !ev.open && !S.isOwner;
  const meals = mealsOf(ev);
  const units = meals.length ? meals.map((m, i) => unitBlock(f, d.units[m.id], m.id, m, i ? meals[i - 1].id : "", locked)).join("") : unitBlock(f, d.units._, "_", null, "", locked);
  const unset = Object.values(d.units).reduce((n, u) => n + Object.values(u.kids).filter(v => !v).length, 0);
  const log = (r?.log || []).slice(-5).reverse();
  return `<section class="card" id="form">
    <div class="block-head"><h2 class="step"><span class="step-no">2</span>${esc(f.name)}${meals.length ? `每一餐的人數（共 ${meals.length} 餐）` : "的人數與餐點"}</h2>
      ${r ? `<span class="small muted">上次更新 ${fmtTime(r.updatedAt)}${r.byAdmin ? "（管理員調整）" : ""}</span>` : `<span class="pill todo">尚未填寫</span>`}</div>
    <div class="members">${adults(f).map(m => `<span class="chip">${esc(m.name)}</span>`).join("")}${kids(f).map(m => `<span class="chip kid">${esc(m.name)}${/小孩/.test(m.name) ? "" : "・小孩"}</span>`).join("")}</div>
    ${!ev.open && S.isOwner ? `<div class="banner info">活動已截止，你是管理員，仍可代為調整。</div>` : ""}
    ${!ev.open && !S.isOwner ? `<div class="banner">此活動已截止，如需更改請直接聯絡管理員。</div>` : ""}
    ${meals.length ? `<p class="small muted">每一餐分開填：不參加的那一餐按「這一餐不參加」；每一餐人數一樣的話，可以按「跟上一餐一樣」。</p>` : ""}
    ${units}
    <div class="block">
      <label class="field" for="note"><span>備註（過敏、晚到、需要兒童椅等）</span><textarea id="note" data-bind="note" ${locked ? "disabled" : ""}>${esc(d.note)}</textarea></label>
      <label class="field" for="who"><span>填寫人（選填，方便大家知道是誰填的）</span><input id="who" type="text" data-bind="who" maxlength="30" value="${esc(d.who)}" ${locked ? "disabled" : ""}></label>
      <label class="field" for="email"><span>Email（選填）：填了會把這個活動加到你的 Google 日曆，並寄一封邀請信給你${ev.date ? "" : "（活動日期確定後才會寄出）"}${r?.hasEmail && !S.isOwner ? "。這一家已經有人留過 Email" : ""}</span><input id="email" type="email" data-bind="email" maxlength="120" autocomplete="email" placeholder="例：name@gmail.com" value="${esc(d.email)}" ${locked ? "disabled" : ""}></label>
    </div>
    ${log.length ? `<div class="block"><div class="label">修改紀錄</div><div class="log">${log.map(l => `<span>${fmtTime(l.at)}　${esc(l.who || (l.admin ? "管理員" : "家人"))}${l.admin ? "（管理員）" : ""}　${esc(l.text)}</span>`).join("")}</div></div>` : ""}
    <div class="actions">
      <button class="btn" data-act="all-absent" ${locked ? "disabled" : ""}>${meals.length ? "全部都不參加" : "全家不克出席"}</button>
      ${d.dirty && r ? `<button class="btn ghost" data-act="revert">還原成已送出的內容</button>` : ""}
    </div>
    <div class="submit-bar">
      ${S.msg ? `<div class="notice ${S.msg.err ? "bad" : "ok"}" role="status">${esc(S.msg.text)}</div>` : unset ? `<div class="notice warn">還有 ${unset} 個小朋友的餐點沒選</div>` : ""}
      <button class="btn primary big" data-act="save" ${locked || unset || S.saving ? "disabled" : ""}>${S.saving ? "送出中…" : r ? "更新回覆" : "送出回覆"}</button>
    </div>
  </section>`;
}

// ---------- 後台 ----------

function eventForm(ef) {
  return `<div class="editor">
    <h3>${ef.id ? "編輯活動" : "新增活動"}</h3>

      <label class="field" for="ev-deadline"><span>填寫截止日</span><input id="ev-deadline" type="date" data-bind="evForm.deadline" value="${esc(ef.deadline)}"></label>
      ${ef.places ? "" : `<label class="field" for="ev-place"><span>主要地點名稱</span><input id="ev-place" type="text" autocomplete="off" data-geo="name" data-pair="evForm.address" data-bind="evForm.place" value="${esc(ef.place)}" placeholder="例：LOFT17森活休閒園區"></label>
      <label class="field" for="ev-address"><span>主要地點地址（會連到 Google 地圖並加進日曆）</span><input id="ev-address" type="text" autocomplete="off" data-geo="addr" data-pair="evForm.place" data-bind="evForm.address" value="${esc(ef.address)}" placeholder="例：新北市石碇區中民里番子坑路17號"></label>`}

    <div class="form-grid">

      <label class="field" for="it-title"><span>名稱</span><input id="it-title" type="text" data-bind="itForm.title" value="${esc(it.title)}" placeholder="例：午餐・A 餐廳"></label>
      <label class="field" for="it-date"><span>日期</span><input id="it-date" type="date" data-bind="itForm.date" value="${esc(it.date)}"></label>
      <label class="field" for="it-time"><span>時間</span><input id="it-time" type="time" data-bind="itForm.time" value="${esc(it.time)}"></label>
      <label class="field" for="it-place"><span>地點名稱</span><input id="it-place" type="text" autocomplete="off" data-geo="name" data-pair="itForm.address" data-bind="itForm.place" value="${esc(it.place)}"></label>
      <label class="field" for="it-address"><span>地址（會連到 Google 地圖）</span><input id="it-address" type="text" autocomplete="off" data-geo="addr" data-pair="itForm.place" data-bind="itForm.address" value="${esc(it.address)}"></label>
      <label class="field" for="it-seats"><span>每桌座位（用餐才需要，估算桌數）</span><input id="it-seats" type="number" min="1" data-bind="itForm.seats" value="${esc(it.seats)}"></label>
    </div>
    <label class="field" for="it-desc"><span>說明（選填）</span><textarea id="it-desc" data-bind="itForm.desc">${esc(it.desc)}</textarea></label>
    <div class="actions"><button class="btn primary" data-act="it-save" ${it.title.trim() && !S.busy ? "" : "disabled"}>${S.busy ? "儲存中…" : "儲存行程"}</button><button class="btn" data-act="it-cancel">取消</button>${adminMsgHtml()}</div></div>`;

function renderAdminHome() {
  const ef = S.evForm && !S.evForm.id ? S.evForm : null;
  const cards = S.events.map(e => {
    const meals = mealsOf(e);
    const n = respondedCount(e);
    let stats;
    if (meals.length) stats = `<span>回覆 <b>${n}</b> / ${S.families.length} 家</span><span>${itemsOf(e).length} 個行程・${meals.length} 餐</span>`;
    else { const sum = tallyUnit(e, null).sum; stats = `<span>回覆 <b>${n}</b> / ${S.families.length} 家</span><span>出席 <b>${sum.people}</b> 人</span><span class="c-meat">葷 <b>${sum.meat}</b></span><span class="c-veg">素 <b>${sum.veg}</b></span>`; }
    return `<button class="ev-card" data-act="open-event" data-id="${e.id}">
      <span class="actions"><span class="pill ${e.open ? "open" : "closed"}">${e.open ? "開放填寫" : "已截止"}</span><span class="pill done">${KIND[e.kind] || "活動"}</span></span>
      <b>${esc(e.title)}</b>
      <span class="small muted">${dateRange(e) || "日期未定"}${e.time ? " " + esc(e.time) : ""}${e.place ? "・" + esc(e.place) : ""}</span>
      <span class="ev-card-stats num">${stats}</span>
      <span class="ev-card-go">查看行程、統計與明細 →</span></button>`;
  }).join("");
  return `<section class="card"><div class="block-head"><h2>家人填寫網址</h2></div>
    <p class="small muted">把這個網址傳到家族 LINE 群組，家人點開就能填寫，不用任何帳號。你自己的後台網址（目前網址列這個）請不要外流。</p>
    <div class="actions"><input id="pub-url" type="text" readonly value="${esc(PUBLIC_URL)}" style="flex:1;min-width:0"><button class="btn" data-act="copy-url">複製</button></div></section>
  <section class="card"><div class="block-head"><h2>活動</h2>${ef ? "" : `<button class="btn primary" data-act="ev-new">新增活動</button>`}</div>
    ${ef ? eventForm(ef) : ""}
    ${S.events.length ? `<div class="ev-cards">${cards}</div>` : (ef ? "" : `<p class="muted">還沒有活動。新增一個聚餐或旅遊，家人就能開始填寫。</p>`)}
    ${ef ? "" : adminMsgHtml()}</section>
  ${renderFamilyAdmin()}`;
}

function statTiles(ev, meal, sum, compact) {
  return `<div class="tiles num${compact ? " compact" : ""}">
    <div class="tile main"><div class="k">${meal ? "這一餐人數" : "出席人數"}</div><div class="v">${sum.people}</div><div class="s">大人 ${sum.aMeat + sum.aVeg}・小孩 ${sum.kMeat + sum.kVeg + sum.kShare}</div></div>
    <div class="tile meat"><div class="k">葷食份數</div><div class="v">${sum.meat}</div><div class="s">大人 ${sum.aMeat}・小孩 ${sum.kMeat}</div></div>
    <div class="tile veg"><div class="k">素食份數</div><div class="v">${sum.veg}</div><div class="s">大人 ${sum.aVeg}・小孩 ${sum.kVeg}</div></div>
    <div class="tile share"><div class="k">小孩共食</div><div class="v">${sum.kShare}</div><div class="s">有座位、不點餐</div></div>
    ${meal || ev.kind === "meal" ? `<div class="tile"><div class="k">估計桌數</div><div class="v">${sum.tables}</div><div class="s">每桌 ${Number(meal ? meal.seats : ev.seats) || 10} 位</div></div>` : ""}
  </div>`;
}

const statusPills = (f, r, t) => (f.fixed ? `<span class="pill adm">固定名額</span>` : r ? (t && !people(t) ? `<span class="pill closed">不出席</span>` : `<span class="pill done">已填</span>`) : `<span class="pill todo">未填</span>`) + (r?.byAdmin ? ` <span class="pill adm">調整過</span>` : "");
const updatedCell = r => r ? esc(fmtTime(r.updatedAt)) + (r.who ? `<br>${esc(r.who)}` : "") : "";
const noteCell = r => `${esc(r?.note || "")}${r?.email ? `<div class="small muted">${esc(r.email)}</div>` : ""}`;
const editBtn = (f, r) => f.fixed ? "" : `<button class="btn ghost" data-act="admin-edit" data-id="${f.id}">${r ? "調整" : "代填"}</button>`;

function renderEventDetail(ev) {
  const meals = mealsOf(ev);
  const editing = S.evForm && S.evForm.id === ev.id;
  const confirming = S.confirm === "ev:" + ev.id;
  const n = [...S.responses.values()].filter(r => r.eventId === ev.id).length;
  const pending = S.families.filter(f => !respondedOf(ev, f)).map(f => f.name);
  const controls = confirming
    ? `<span class="err">刪除這個活動、所有行程和全部 ${n} 筆回覆？</span><button class="btn danger" data-act="ev-del-yes" data-id="${ev.id}">確定刪除</button><button class="btn" data-act="confirm-cancel">取消</button>`
    : `<button class="btn primary" data-act="ev-edit" data-id="${ev.id}">編輯活動</button>
       <button class="btn" data-act="ev-toggle" data-id="${ev.id}" ${S.busy ? "disabled" : ""}>${ev.open ? "截止填寫" : "重新開放填寫"}</button>
       <button class="btn ghost" data-act="ev-del" data-id="${ev.id}">刪除活動</button>${S.itForm || S.evForm ? "" : adminMsgHtml()}`;
  const newItem = S.itForm && !S.itForm.id;
  const planSection = `<section class="card"><div class="block-head"><div><h2>行程安排</h2><span class="small muted">依順序排列；「用餐」行程會讓家人分開回報每一餐。${meals.length ? "" : "目前沒有用餐行程，整個活動就當成一餐統計。"}</span></div>${newItem ? "" : `<button class="btn primary" data-act="it-new">＋ 新增地點／行程</button>`}</div>
    ${planList(ev, true) || (newItem ? "" : `<p class="muted">還沒有行程。聚餐可以不加；旅遊可以依序加上集合、景點、每一餐的餐廳、住宿。</p>`)}
    ${newItem ? itemForm(S.itForm) : ""}</section>`;
  return `<div class="actions"><button class="btn ghost back" data-act="close-event">← 所有活動</button></div>
  <div class="card">${editing ? eventForm(S.evForm) : eventHead(ev) + `<div class="actions">${controls}</div>`}</div>
  ${planSection}
  <div class="tiles num"><div class="tile main"><div class="k">回覆家庭</div><div class="v">${S.families.length - pending.length}<span class="s"> / ${S.families.length}</span></div><div class="s">${pending.length ? `未填 ${pending.length} 家` : "全部到齊"}</div></div></div>
  ${pending.length ? `<div class="banner">尚未填寫：${pending.map(esc).join("、")}</div>` : ""}
  ${meals.length ? renderMealStats(ev, meals) : renderSingleStats(ev)}`;
}

function exportBar() {
  return `<div class="actions"><button class="btn primary" data-act="export" ${S.busy ? "disabled" : ""}>匯出到試算表</button><button class="btn" data-act="tsv">複製表格</button>
    ${S.exportUrl ? `<a class="btn ghost" href="${esc(S.exportUrl)}" target="_blank" rel="noopener">打開「匯出」工作表</a>` : ""}</div>`;
}

function renderSingleStats(ev) {
  const { rows, sum } = tallyUnit(ev, null);
  return `${statTiles(ev, null, sum)}
  <section class="card"><div class="block-head"><h2>各家庭明細</h2>${exportBar()}</div>
    <textarea id="tsv-box" readonly hidden></textarea>
    <div class="tbl-wrap"><table>
      <thead><tr><th rowspan="2">家庭</th><th rowspan="2">狀態</th><th class="grp" colspan="3">大人</th><th class="grp" colspan="4">小孩</th><th class="grp n" rowspan="2">出席</th><th rowspan="2" class="bl">備註</th><th rowspan="2">最後更新</th><th rowspan="2"></th></tr>
      <tr><th class="n bl">葷</th><th class="n">素</th><th class="n">缺席</th><th class="n bl">葷</th><th class="n">素</th><th class="n">共食</th><th class="n">缺席</th></tr></thead>
      <tbody>${rows.map(({ f, c, t }) => { const r = f.fixed ? null : S.responses.get(respKey(ev.id, f.id)); return `<tr class="${c ? "" : "pending"}">
        <td><b>${esc(f.name)}</b><div class="small muted">大人 ${t.adults}・小孩 ${t.kidsTotal}</div></td>
        <td>${statusPills(f, c && (r || f.fixed), t)}${t.kUnset && c ? ` <span class="pill todo">小孩未選 ${t.kUnset}</span>` : ""}</td>
        <td class="n bl">${c ? t.aMeat : "–"}</td><td class="n">${c ? t.aVeg : "–"}</td><td class="n">${c ? t.aOff : "–"}</td>
        <td class="n bl">${c ? t.kMeat : "–"}</td><td class="n">${c ? t.kVeg : "–"}</td><td class="n">${c ? t.kShare : "–"}</td><td class="n">${c ? t.kOff : "–"}</td>
        <td class="n bl"><b>${c ? people(t) : "–"}</b></td>
        <td class="wrap-cell">${f.fixed ? "固定名額" : noteCell(r)}</td>
        <td class="small muted">${updatedCell(r)}</td>
        <td>${editBtn(f, r)}</td></tr>`; }).join("")}
        <tr class="total"><td>合計</td><td>${sum.responded}/${sum.families}</td><td class="n bl">${sum.aMeat}</td><td class="n">${sum.aVeg}</td><td class="n">${sum.aOff}</td><td class="n bl">${sum.kMeat}</td><td class="n">${sum.kVeg}</td><td class="n">${sum.kShare}</td><td class="n">${sum.kOff}</td><td class="n bl">${sum.people}</td><td></td><td></td><td></td></tr>
      </tbody></table></div>
    <p class="small muted">這裡只有「${esc(ev.title)}」的回覆。「調整」會帶你到填寫畫面修改該家庭的回覆，修改紀錄會標註為管理員調整。</p>
  </section>`;
}

// 多餐的活動：每一餐各自一組統計，最後一張表把每家每一餐並排
function renderMealStats(ev, meals) {
  const per = meals.map(m => ({ m, ...tallyUnit(ev, m) }));
  const blocks = per.map(({ m, sum }) => `<section class="card meal-stat">
      <div class="block-head"><div><h3>${esc(m.title)}</h3><span class="small muted">${[whenText(m.date, m.time), m.place].filter(Boolean).map(esc).join("・")}</span></div>
        <span class="small muted num">已回覆這一餐 ${sum.responded} / ${sum.families} 家</span></div>
      ${statTiles(ev, m, sum, true)}</section>`).join("");
  const cell = (c, t) => !c ? "–" : people(t) ? `<b>${people(t)}</b> 人<div class="small muted">葷${t.aMeat + t.kMeat} 素${t.aVeg + t.kVeg}${t.kShare ? ` 共食${t.kShare}` : ""}</div>` : `<span class="muted">不參加</span>`;
  return `${blocks}
  <section class="card"><div class="block-head"><h2>各家庭明細</h2>${exportBar()}</div>
    <textarea id="tsv-box" readonly hidden></textarea>
    <div class="tbl-wrap"><table>
      <thead><tr><th>家庭</th><th>狀態</th>${meals.map(m => `<th class="bl">${esc(m.title)}<div class="small muted">${esc(whenText(m.date, m.time))}</div></th>`).join("")}<th class="bl">備註</th><th>最後更新</th><th></th></tr></thead>
      <tbody>${S.families.map(f => { const r = f.fixed ? null : S.responses.get(respKey(ev.id, f.id)); return `<tr class="${respondedOf(ev, f) ? "" : "pending"}">
        <td><b>${esc(f.name)}</b><div class="small muted">大人 ${adults(f).length}・小孩 ${kids(f).length}</div></td>
        <td>${statusPills(f, r || f.fixed, null)}</td>
        ${per.map(({ rows }) => { const x = rows.find(y => y.f.id === f.id); return `<td class="meal-cell bl">${cell(x.c, x.t)}</td>`; }).join("")}
        <td class="wrap-cell bl">${f.fixed ? "固定名額" : noteCell(r)}</td>
        <td class="small muted">${updatedCell(r)}</td>
        <td>${editBtn(f, r)}</td></tr>`; }).join("")}
        <tr class="total"><td>合計</td><td>${respondedCount(ev)}/${S.families.length}</td>${per.map(({ sum }) => `<td class="meal-cell bl">${sum.people} 人<div class="small muted">葷${sum.meat} 素${sum.veg}${sum.kShare ? ` 共食${sum.kShare}` : ""}</div></td>`).join("")}<td class="bl"></td><td></td><td></td></tr>
      </tbody></table></div>
    <p class="small muted">「–」表示這一家還沒回覆這一餐（例如餐廳是後來才加的）。「調整」會帶你到填寫畫面修改該家庭的回覆。</p>
  </section>`;
}

function renderFamilyAdmin() {
  const ff = S.famForm;
  const form = ff ? `<div class="editor">
    <h3>${ff.id ? "編輯家庭" : "新增家庭"}</h3>
    <label class="field" for="fam-name"><span>家庭名稱</span><input id="fam-name" type="text" data-bind="famForm.name" value="${esc(ff.name)}" placeholder="例：大伯家"></label>
    <div class="form-grid">
      <label class="field" for="fam-adults"><span>大人（每行一位，或用「、」分隔）</span><textarea id="fam-adults" data-bind="famForm.adults">${esc(ff.adults)}</textarea></label>
      <label class="field" for="fam-kids"><span>小孩（每行一位，或用「、」分隔）</span><textarea id="fam-kids" data-bind="famForm.kids">${esc(ff.kids)}</textarea></label>
    </div>
    <p class="small muted">名字可以只寫代稱，例如「大人 1」「老大」。</p>
    <div class="actions"><button class="btn primary" data-act="fam-save" ${ff.name.trim() && !S.busy ? "" : "disabled"}>儲存家庭</button><button class="btn" data-act="fam-cancel">取消</button></div></div>` : "";
  const list = S.families.map((f, i) => {
    const confirming = S.confirm === "fam:" + f.id;
    return `<div class="li"><div class="main"><b>${esc(f.name)}</b><span class="small muted">大人：${adults(f).map(m => esc(m.name)).join("、") || "—"}${kids(f).length ? `　小孩：${kids(f).map(m => esc(m.name)).join("、")}` : ""}</span></div>
      <div class="actions">${f.fixed ? `<span class="pill adm">固定名額</span>` : confirming ? `<span class="err">刪除「${esc(f.name)}」？</span><button class="btn danger" data-act="fam-del-yes" data-id="${f.id}">確定刪除</button><button class="btn" data-act="confirm-cancel">取消</button>` : `
        <button class="btn ghost" data-act="fam-move" data-id="${f.id}" data-d="-1" ${i === 0 || S.busy ? "disabled" : ""} aria-label="上移">↑</button>
        <button class="btn ghost" data-act="fam-move" data-id="${f.id}" data-d="1" ${i === S.families.length - 1 || S.busy ? "disabled" : ""} aria-label="下移">↓</button>
        <button class="btn" data-act="fam-edit" data-id="${f.id}">編輯</button>
        <button class="btn ghost" data-act="fam-del" data-id="${f.id}">刪除</button>`}</div></div>`;
  }).join("");
  const totals = S.families.reduce((a, f) => [a[0] + adults(f).length, a[1] + kids(f).length], [0, 0]);
  return `<section class="card"><div class="block-head"><div><h2>家庭名單</h2><span class="small muted num">${S.families.length} 個家庭・大人 ${totals[0]}・小孩 ${totals[1]}・共 ${totals[0] + totals[1]} 人</span></div>${ff ? "" : `<button class="btn primary" data-act="fam-new">新增家庭</button>`}</div>
    ${form}${S.families.length ? `<div class="list">${list}</div>` : ""}
    <details ${S.families.length ? "" : "open"}><summary class="label" style="cursor:pointer">一次匯入多個家庭</summary>
      <div class="block" style="border:0">
        <p class="small muted">每行一個家庭，格式：<code>家庭名稱｜大人1、大人2｜小孩1、小孩2</code>。沒有小孩可以省略最後一段。</p>
        <textarea id="bulk" data-bind="bulk" placeholder="大伯家｜陳大明、林美玲｜陳小寶、陳小貝&#10;二姑家｜王志強、陳淑芬">${esc(S.bulk)}</textarea>
        <div class="actions"><button class="btn" data-act="bulk" ${S.bulk.trim() && !S.busy ? "" : "disabled"}>匯入</button></div>
      </div></details></section>`;
}

// ---------- data ----------
function apply(data) {
  S.families = (data.families || []).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
  S.events = (data.events || []).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  S.items = data.items || [];
  S.responses = new Map(Object.entries(data.responses || {}));
  S.isOwner = !!data.admin;
  if (S.adminEvent && !S.events.some(e => e.id === S.adminEvent)) S.adminEvent = null;
  if (S.fillEvent && !S.events.some(e => e.id === S.fillEvent)) S.fillEvent = null;
  S.ready = true; S.loadErr = null;
  if (!S.events.some(e => e.id === S.eventId)) S.eventId = (S.events.find(e => e.open) || S.events[0])?.id || null;
  if (!openFams().some(f => f.id === S.familyId)) S.familyId = null;
  // 行程的餐數變了（例如管理員剛加了一間餐廳）就重建草稿
  const ev = curEvent();
  if (S.draft && ev && Object.keys(S.draft.units).join() !== unitIds(ev).join()) syncDraft(true); else syncDraft(false);
  render();
  return data;
}
async function refresh() {
  try { apply(await api("getData", ADMIN_KEY)) } catch (e) { S.loadErr = errText(e); render() }
}
// 管理動作：送到伺服器，成功後用回傳的最新資料重畫
async function adminCall(fn, ...args) {
  S.busy = true; render();
  try { const data = await api(fn, ADMIN_KEY, ...args); S.busy = false; apply(data); return data }
  catch (e) { S.busy = false; flash("adminMsg", errText(e), true); return null }
}

// ---------- actions ----------
function flash(key, text, err) { S[key] = { text, err }; render(); if (!err) setTimeout(() => { if (S[key]?.text === text) { S[key] = null; render() } }, 8000) }

const calMsg = (c, email) => c === "added" ? `已送出，謝謝！行事曆邀請已寄到 ${email}` : c === "nodate" ? "已送出，謝謝！活動日期確定後，會把行事曆邀請寄到你的信箱。" : c === "failed" ? "已送出，但加入行事曆沒有成功，請告訴管理員。" : "已送出，謝謝！";
async function saveResponse() {
  const ev = curEvent(), f = curFamily(), d = S.draft;
  if (!ev || !f || !d) return;
  S.saving = true; S.msg = null; render();
  store.set("rsvp.who", d.who.trim());
  if (!S.isOwner) store.set("rsvp.email", d.email.trim());
  try {
    const data = await api("saveResponse", { eventId: ev.id, familyId: f.id, units: d.units, note: d.note, who: d.who, email: d.email.trim() }, ADMIN_KEY);
    S.saving = false; d.dirty = false; apply(data); syncDraft(true); flash("msg", calMsg(data.calendar, d.email.trim()), data.calendar === "failed");
  } catch (e) { S.saving = false; flash("msg", errText(e), true) }
}

const kidLabel = v => (KID_OPTS.find(o => o[0] === v) || [, "未選"])[1];
function tableRows(ev) {
  const meals = mealsOf(ev);
  const tail = ["備註", "最後更新", "填寫人", "管理員調整過", "Email"];
  const info = f => { const r = f.fixed ? null : S.responses.get(respKey(ev.id, f.id)); return f.fixed ? ["固定名額", "", "", "", ""] : [r?.note || "", r?.updatedAt || "", r?.who || "", r?.byAdmin ? "是" : "", r?.email || ""]; };
  const status = f => f.fixed ? "固定名額" : respondedOf(ev, f) ? "已填" : "未填";
  let out;
  if (!meals.length) {
    const { rows, sum } = tallyUnit(ev, null);
    out = [["家庭", "狀態", "大人總數", "大人葷食", "大人素食", "大人不出席", "小孩總數", "小孩葷食餐", "小孩素食餐", "小孩共食", "小孩不參加", "出席人數", "葷食份數", "素食份數", "小孩明細", ...tail]];
    for (const { f, c, t } of rows) {
      const kidDetail = kids(f).map(k => `${k.name}:${kidLabel(c?.kids?.[k.id])}`).join(" / ");
      out.push(c ? [f.name, f.fixed ? "固定名額" : people(t) ? "已填" : "不出席", t.adults, t.aMeat, t.aVeg, t.aOff, t.kidsTotal, t.kMeat, t.kVeg, t.kShare, t.kOff, people(t), t.aMeat + t.kMeat, t.aVeg + t.kVeg, kidDetail, ...info(f)]
        : [f.name, "未填", t.adults, "", "", "", t.kidsTotal, "", "", "", "", "", "", "", "", ...info(f)]);
    }
    out.push(["合計", `${sum.responded}/${sum.families}`, "", sum.aMeat, sum.aVeg, sum.aOff, "", sum.kMeat, sum.kVeg, sum.kShare, sum.kOff, sum.people, sum.meat, sum.veg]);
  } else {
    const per = meals.map(m => ({ m, ...tallyUnit(ev, m) }));
    out = [["家庭", "狀態", "大人總數", "小孩總數", ...per.flatMap(({ m }) => [`${m.title}・人數`, `${m.title}・葷`, `${m.title}・素`, `${m.title}・共食`, `${m.title}・小孩明細`]), ...tail]];
    for (const f of S.families) {
      const cols = per.flatMap(({ rows }) => {
        const { c, t } = rows.find(y => y.f.id === f.id);
        if (!c) return ["", "", "", "", ""];
        return [people(t), t.aMeat + t.kMeat, t.aVeg + t.kVeg, t.kShare, kids(f).map(k => `${k.name}:${kidLabel(c.kids?.[k.id])}`).join(" / ")];
      });
      out.push([f.name, status(f), adults(f).length, kids(f).length, ...cols, ...info(f)]);
    }
    out.push(["合計", `${respondedCount(ev)}/${S.families.length}`, "", "", ...per.flatMap(({ sum }) => [sum.people, sum.meat, sum.veg, sum.kShare, ""])]);
  }
  const head = out[0];
  out.forEach(row => { while (row.length < head.length) row.push("") });
  return out;
}

async function copyText(text, box) {
  try { await navigator.clipboard.writeText(text); return true }
  catch { if (box) { box.hidden = false; box.value = text; box.focus(); box.select(); try { return document.execCommand("copy") } catch { return false } } return false }
}

const unitAbsent = (f, u) => { u.adultsMeat = 0; u.adultsVeg = 0; for (const k of kids(f)) u.kids[k.id] = "absent"; };
const blankItem = ev => ({ id: null, eventId: ev.id, kind: "meal", title: "", date: ev.date || "", time: "", place: "", address: "", desc: "", seats: String(ev.seats || 10) });

async function act(a, ds) {
  const ev = curEvent();
  const msgKey = S.view === "admin" ? "adminMsg" : "msg";
  switch (a) {
    case "refresh": return refresh();
    case "view": S.view = ds.v; S.confirm = null; store.set("rsvp.view", ds.v); break;
    case "pick-event": S.fillEvent = S.eventId = ds.id; store.set("rsvp.event", ds.id); S.msg = null; syncDraft(true); render(); window.scrollTo(0, 0); return;
    case "back-list": S.fillEvent = null; S.msg = null; render(); window.scrollTo(0, 0); return;
    case "open-event": S.adminEvent = ds.id; S.eventId = ds.id; store.set("rsvp.event", ds.id); S.evForm = null; S.itForm = null; S.confirm = null; S.exportUrl = null; S.adminMsg = null; syncDraft(true); render(); window.scrollTo(0, 0); return;
    case "close-event": S.adminEvent = null; S.evForm = null; S.itForm = null; S.confirm = null; S.adminMsg = null; render(); window.scrollTo(0, 0); return;
    case "family": S.familyId = ds.id; store.set("rsvp.family", ds.id); S.msg = null; syncDraft(true); render(); document.getElementById("form")?.scrollIntoView({ behavior: "smooth", block: "start" }); return;
    case "adult": { const f = curFamily(), u = S.draft.units[ds.u]; const v = u[ds.k] + Number(ds.d); const other = ds.k === "adultsMeat" ? u.adultsVeg : u.adultsMeat;
      if (v >= 0 && v + other <= adults(f).length) { u[ds.k] = v; S.draft.dirty = true; S.msg = null } break }
    case "kid": S.draft.units[ds.u].kids[ds.id] = ds.v; S.draft.dirty = true; S.msg = null; break;
    case "unit-absent": unitAbsent(curFamily(), S.draft.units[ds.u]); S.draft.dirty = true; S.msg = null; break;
    case "unit-copy": S.draft.units[ds.u] = JSON.parse(JSON.stringify(S.draft.units[ds.from])); S.draft.dirty = true; S.msg = null; break;
    case "all-absent": { const f = curFamily(); Object.values(S.draft.units).forEach(u => unitAbsent(f, u)); S.draft.dirty = true; S.msg = null; break }
    case "revert": syncDraft(true); break;
    case "save": return saveResponse();
    case "admin-edit": S.view = "fill"; S.fillEvent = S.eventId; S.familyId = ds.id; store.set("rsvp.family", ds.id); S.msg = null; syncDraft(true); render(); document.getElementById("form")?.scrollIntoView({ block: "start" }); return;
    case "copy-url": { const ok = await copyText(PUBLIC_URL, document.getElementById("pub-url")); if (!ok) document.getElementById("pub-url")?.select(); return }
    case "copy-addr": case "copy-it-addr": {
      const src = a === "copy-addr" ? S.events.find(e => e.id === ds.id) : S.items.find(i => i.id === ds.id);
      const ok = await copyText(src?.address || "");
      flash(msgKey, ok ? "地址已複製" : "瀏覽器不允許複製，請長按地址手動複製", !ok); return;
    }
    case "tsv": {
      const tsv = tableRows(ev).map(r => r.map(c => String(c ?? "").replace(/[\t\n]/g, " ")).join("\t")).join("\n");
      const ok = await copyText(tsv, document.getElementById("tsv-box"));
      flash("adminMsg", ok ? "已複製，可直接貼到 Excel 或 Google 試算表" : "請在下方文字框按 Ctrl+C／⌘C 複製", !ok);
      if (!ok) { const box = document.getElementById("tsv-box"); box.hidden = false; box.value = tsv; box.select() }
      return;
    }
    case "export": {
      S.busy = true; render();
      try { S.exportUrl = await api("adminExport", ADMIN_KEY, tableRows(ev)); S.busy = false; flash("adminMsg", "已寫入試算表的「匯出」工作表") }
      catch (e) { S.busy = false; flash("adminMsg", errText(e), true) }
      return;
    }
    case "ev-new": S.evForm = { id: null, title: "", kind: "meal", date: "", endDate: "", deadline: "", place: "", seats: "10", desc: "", time: "", address: "" }; S.evForm.places = [blankPlace(S.evForm)]; break;
    case "ev-edit": { const e = S.events.find(x => x.id === ds.id); S.itForm = null; S.evForm = { id: e.id, title: e.title || "", kind: e.kind || "meal", date: e.date || "", endDate: e.endDate || "", deadline: e.deadline || "", place: e.place || "", seats: String(e.seats || 10), desc: e.desc || "", time: e.time || "", address: e.address || "" };
      // 還沒有行程的活動可以直接在這裡多加地點；已經有行程的，地點改在「行程安排」管理
      if (!itemsOf(e).length) S.evForm.places = [{ title: e.place || "", address: e.address || "", kind: e.kind === "trip" ? "plan" : "meal", date: e.date || "", time: e.time || "" }];
      break }
    case "place-add": S.evForm.places.push(blankPlace(S.evForm)); break;
    case "place-del": if (S.evForm.places.length > 1) S.evForm.places.splice(Number(ds.i), 1); break;
    case "ev-cancel": S.evForm = null; break;
    case "ev-save": {
      const ef = S.evForm, { places, ...payload } = ef;
      const rows = (places || []).filter(p => p.title.trim() || p.address.trim());
      if (places) { payload.place = rows[0]?.title.trim() || ""; payload.address = rows[0]?.address.trim() || ""; }
      const data = await adminCall("adminSaveEvent", payload);
      if (!data) return;
      S.eventId = S.adminEvent = data.savedId; store.set("rsvp.event", data.savedId);
      let failed = data.calendar === "failed";
      // 兩個以上的地點：依序建立成行程
      if (rows.length > 1) {
        for (const p of rows) {
          const r = await adminCall("adminSaveItem", { id: null, eventId: data.savedId, kind: p.kind, title: p.title.trim() || p.address.trim(), date: p.date || payload.date, time: p.time, place: "", address: p.address.trim(), desc: "", seats: payload.seats });
          if (!r) { failed = true; break }
        }
      }
      S.evForm = null; syncDraft(true);
      flash("adminMsg", failed ? "活動已儲存，但有部分地點或日曆沒有更新成功，請檢查行程安排" : rows.length > 1 ? `活動已儲存，${rows.length} 個地點已放進行程安排` : "活動已儲存", failed);
      return;
    }
    case "ev-toggle": return adminCall("adminToggleEvent", ds.id);
    case "ev-del": case "fam-del": case "it-del": S.confirm = a.split("-")[0] + ":" + ds.id; break;
    case "confirm-cancel": S.confirm = null; break;
    case "ev-del-yes": { S.confirm = null; const data = await adminCall("adminDeleteEvent", ds.id); if (data) { S.adminEvent = null; flash("adminMsg", "活動已刪除") } return }
    case "it-new": S.evForm = null; S.itForm = blankItem(ev); break;
    case "it-edit": { const it = S.items.find(x => x.id === ds.id); S.evForm = null; S.itForm = { ...it, time: it.time || "", seats: String(it.seats || 10) }; break }
    case "it-cancel": S.itForm = null; break;
    case "it-save": { const data = await adminCall("adminSaveItem", S.itForm); if (data) { S.itForm = null; flash("adminMsg", data.calendar === "failed" ? "行程已儲存，但更新日曆沒有成功" : "行程已儲存", data.calendar === "failed") } return }
    case "it-del-yes": { S.confirm = null; const data = await adminCall("adminDeleteItem", ds.id); if (data) flash("adminMsg", "行程已刪除"); return }
    case "it-move": return adminCall("adminMoveItem", ds.id, Number(ds.d));
    case "fam-new": S.famForm = { id: null, name: "", adults: "", kids: "" }; break;
    case "fam-edit": { const f = S.families.find(x => x.id === ds.id); S.famForm = { id: f.id, name: f.name, adults: adults(f).map(m => m.name).join("\n"), kids: kids(f).map(m => m.name).join("\n") }; break }
    case "fam-cancel": S.famForm = null; break;
    case "fam-save": { const data = await adminCall("adminSaveFamily", S.famForm); if (data) S.famForm = null; break }
    case "fam-del-yes": S.confirm = null; return adminCall("adminDeleteFamily", ds.id);
    case "fam-move": return adminCall("adminMoveFamily", ds.id, Number(ds.d));
    case "bulk": { const data = await adminCall("adminBulk", S.bulk); if (data) { S.bulk = ""; flash("adminMsg", `已匯入 ${data.imported} 個家庭`) } return }
  }
  render();
}

// 表單欄位：每個表單的「儲存」按鈕在必填欄位有值時才能按
const FORM_SAVE = { evForm: ["ev-save", "title"], famForm: ["fam-save", "name"], itForm: ["it-save", "title"] };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});
function onField(e) {
  const k = e.target.dataset?.bind; if (!k) return;
  if (k === "note" || k === "who" || k === "email") { S.draft[k] = e.target.value; S.draft.dirty = true; return }
  if (k === "bulk") { S.bulk = e.target.value; const btn = document.querySelector('[data-act="bulk"]'); if (btn) btn.disabled = !S.bulk.trim(); return }
  const path = k.split("."), obj = path[0];
  if (!S[obj]) return;
  let t = S[obj];
  for (const p of path.slice(1, -1)) t = t[p];
  t[path[path.length - 1]] = e.target.value;
  const [act, req] = FORM_SAVE[obj] || [];
  const save = act && document.querySelector(`[data-act="${act}"]`);
  if (save) save.disabled = !String(S[obj][req]).trim();
}
document.addEventListener("input", onField);
// ---------- Google 地點建議（只有後台的地點、地址欄位）----------
// 打字時列出 Google 地圖的建議，點一下就把店名和完整地址一起填進表單
let geoLib = null, geoSeq = 0, geoTimer = 0, geoToken = null, geoFor = null;
function loadPlaces() {
  if (!geoLib) geoLib = new Promise((res, rej) => {
    window.__mapsReady = () => google.maps.importLibrary("places").then(res, rej);
    const sc = document.createElement("script");
    sc.src = `https://maps.googleapis.com/maps/api/js?key=${MAPS_KEY}&v=weekly&language=zh-TW&region=TW&loading=async&callback=__mapsReady`;
    sc.onerror = () => { geoLib = null; rej(new Error("maps")) };
    document.head.appendChild(sc);
  });
  return geoLib;
}
function setPath(path, value) {
  const parts = path.split("."); let t = S[parts[0]];
  if (!t) return;
  for (const p of parts.slice(1, -1)) t = t[p];
  t[parts[parts.length - 1]] = value;
  const el = document.querySelector(`[data-bind="${path}"]`);
  if (el) el.value = value;
}
const getPath = path => path.split(".").reduce((t, p) => t?.[p], S);
function geoClose() { document.getElementById("geo-box")?.remove(); geoFor = null; }
function geoInput(input) {
  clearTimeout(geoTimer);
  const q = input.value.trim();
  if (q.length < 2) { geoClose(); return }
  geoTimer = setTimeout(async () => {
    const seq = ++geoSeq;
    let lib;
    try { lib = await loadPlaces() } catch { return }
    geoToken = geoToken || new lib.AutocompleteSessionToken();
    let list = [];
    try {
      const { suggestions } = await lib.AutocompleteSuggestion.fetchAutocompleteSuggestions({ input: q, sessionToken: geoToken, language: "zh-TW", region: "tw" });
      list = suggestions.map(x => x.placePrediction).filter(Boolean);
    } catch { return }
    if (seq !== geoSeq || document.activeElement !== input) return;
    geoShow(input, list);
  }, 250);
}
function geoShow(input, list) {
  geoClose();
  if (!list.length) return;
  geoFor = { input, list };
  const r = input.getBoundingClientRect();
  const box = document.createElement("div");
  box.id = "geo-box"; box.className = "geo-box"; box.setAttribute("role", "listbox");
  box.style.left = (r.left + window.scrollX) + "px"; box.style.top = (r.bottom + window.scrollY + 4) + "px"; box.style.width = r.width + "px";
  box.innerHTML = list.slice(0, 5).map((p, i) => `<button type="button" class="geo-item" data-geo-i="${i}">
      <b>${esc(p.mainText?.toString() || p.text.toString())}</b><span>${esc(p.secondaryText?.toString() || "")}</span></button>`).join("")
    + `<div class="geo-by">建議地點由 Google 提供</div>`;
  // 用 pointerdown 選，免得輸入框先失焦把清單關掉
  box.addEventListener("pointerdown", e => { const b = e.target.closest("[data-geo-i]"); if (b) { e.preventDefault(); geoPick(Number(b.dataset.geoI)) } });
  document.body.appendChild(box);
}
async function geoPick(i) {
  if (!geoFor) return;
  const { input, list } = geoFor;
  geoClose();
  const place = list[i].toPlace();
  try { await place.fetchFields({ fields: ["displayName", "formattedAddress"] }) } catch { return }
  geoToken = null;
  const name = place.displayName || "", addr = (place.formattedAddress || "").replace(/^\d{3,6}\s*台灣/, "").replace(/^台灣/, "");
  const self = input.dataset.bind, pair = input.dataset.pair;
  const nameKey = input.dataset.geo === "name" ? self : pair, addrKey = input.dataset.geo === "name" ? pair : self;
  if (input.dataset.geo === "name" || !String(getPath(nameKey) || "").trim()) setPath(nameKey, name);
  setPath(addrKey, addr || name);
  // 行程名稱還空著的話，順便用店名當名稱
  if (self.startsWith("itForm.") && !String(S.itForm?.title || "").trim()) { setPath("itForm.title", name); const b = document.querySelector('[data-act="it-save"]'); if (b) b.disabled = false }
}
document.addEventListener("input", e => { if (S.isOwner && e.target.dataset?.geo) geoInput(e.target) });
document.addEventListener("focusout", e => { if (e.target.dataset?.geo) setTimeout(() => { if (geoFor?.input === e.target) geoClose() }, 200) });
document.addEventListener("keydown", e => { if (e.key === "Escape") geoClose() });
window.addEventListener("resize", geoClose);

document.addEventListener("change", onField);

// 每 30 秒自動更新一次，看得到其他家庭剛送出的狀態
// 不需要手動重新整理：每 30 秒自動更新，切回這個頁面（例如從 LINE 回來）時也會馬上更新
const autoRefresh = () => { if (document.visibilityState === "visible" && !S.saving && !S.busy) refresh() };
setInterval(autoRefresh, 30000);
document.addEventListener("visibilitychange", autoRefresh);
refresh();
})();
</script>
