<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TomicaGo 3D 擬真預覽</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0b0d12; --card:rgba(16,19,27,.82); --line:rgba(255,255,255,.14); --text:#eef1f7; --dim:#9aa4b5; --red:#e8001d; --gold:#fbbf24; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,'Noto Sans TC','PingFang TC',sans-serif; overflow:hidden; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent); pointer-events:none; }
  .top b { font-size:15px; letter-spacing:.5px; } .top b span { color:var(--red); }
  .top small { color:var(--dim); font-size:11px; margin-left:auto; text-align:right; }
  .panel { position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; background:var(--card); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:18px; padding:12px 14px 10px; }
  .panel.min .body { display:none; }
  .row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:13px; }
  .row label { width:62px; color:var(--dim); flex-shrink:0; }
  .row output { width:70px; text-align:right; font-variant-numeric:tabular-nums; color:var(--gold); font-weight:700; font-size:12px; }
  input[type=range] { flex:1; accent-color:var(--red); min-width:0; }
  select, input[type=color] { background:#1a1f2b; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:7px 8px; font-size:13px; flex:1; min-width:0; font-family:inherit; }
  input[type=color] { padding:2px; height:34px; flex:0 0 52px; }
  .seg { display:flex; gap:6px; flex:1; }
  .seg button, .tog { flex:1; background:#1a1f2b; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 4px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .seg button.on, .tog.on { background:var(--red); border-color:var(--red); }
  .handle { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--dim); cursor:pointer; }
  .handle b { color:var(--text); font-size:13px; }
  #load { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-size:14px; color:var(--dim); z-index:5; transition:opacity .4s; }
  #load.done { opacity:0; pointer-events:none; }
  #fps { position:fixed; top:calc(34px + env(safe-area-inset-top)); left:14px; font:11px ui-monospace,Menlo,monospace; color:#9fe8b4; text-shadow:0 1px 2px #000; pointer-events:none; }
  #credit { position:fixed; right:12px; top:calc(34px + env(safe-area-inset-top)); font-size:9px; color:rgba(255,255,255,.55); text-align:right; line-height:1.4; pointer-events:none; max-width:55%; }
</style>
<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<canvas id="view"></canvas>
<div class="top"><b>TOMICA<span> 3D</span> 擬真預覽</b><small id="place">摩納哥</small></div>
<div id="fps"></div>

<div class="panel" id="panel">

  <div class="body">

    <div class="row"><label>車速</label><input id="spd" type="range" min="0" max="220" step="5" value="90"><output id="sO"></output></div>
    <div class="row"><label>品質</label><div class="seg"><button class="tog on" id="shadowT">即時陰影</button><button class="tog" id="brakeT">煞車燈</button><button class="tog" id="lightT">頭燈</button></div></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const setLoad = t => { $('loadtxt').textContent = t; };

// ───────── 資料 ─────────
setLoad('載入車輛與賽道資料…');
const [carsData, track] = await Promise.all([fetch('3d/cars.json').then(r => r.json()), fetch('3d/monaco.json').then(r => r.json())]);

// ───────── 渲染器 ─────────
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.3, 6000);
function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

// ───────── 天空、太陽（真實位置）、光 ─────────
const sky = new Sky(); sky.scale.setScalar(4500); scene.add(sky);
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.06;
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 420 });
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x4a4438, 0.5); scene.add(hemi);
scene.fog = new THREE.FogExp2(0xaab8c8, 0.0004);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

// 太陽高度／方位：依緯度、日期（一年中的第幾天）和當地太陽時算出來，跟 SunCalc 同樣的天文公式
function sunAngles(latDeg, doy, solarHour) {
  const lat = latDeg * D2R, decl = 23.44 * D2R * Math.sin(2 * Math.PI * (284 + doy) / 365), H = (solarHour - 12) * 15 * D2R;
  const alt = Math.asin(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)) + Math.PI; // 由北順時針
  return { alt, az };
}
const now = new Date(), doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
const sunVec = new THREE.Vector3();
let envDirty = true, lastEnvAt = 0;
const state = { t: 16.2, rain: 0, speed: 90, cam: 'chase', shadows: true, brake: false, lights: false };

function applyAtmosphere() {
  const { alt, az } = sunAngles(track.lat, doy, state.t);
  sunVec.set(Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt));
  const day = THREE.MathUtils.clamp(Math.sin(alt) * 3 + 0.25, 0, 1), rain = state.rain;
  const u = sky.material.uniforms;
  u.turbidity.value = 2 + 14 * rain + (alt < 0.2 ? 4 : 0); u.rayleigh.value = 1.2 + 2.5 * (1 - day) - 0.6 * rain; u.mieCoefficient.value = 0.004 + 0.02 * rain; u.mieDirectionalG.value = 0.8;
  u.sunPosition.value.copy(sunVec);
  const warm = new THREE.Color(0xfff2e0).lerp(new THREE.Color(0xff9a4a), THREE.MathUtils.clamp(1 - alt / 0.45, 0, 1));
  sun.color.copy(warm); sun.intensity = Math.max(0, Math.sin(alt)) * 3.4 * (1 - 0.88 * rain) * (alt > 0 ? 1 : 0);
  hemi.intensity = 0.4 + 0.45 * day * (1 - 0.35 * rain);
  hemi.color.set(0xbcd4ff).lerp(new THREE.Color(0x4a5b86), 1 - day);
  renderer.toneMappingExposure = 0.34 + 0.5 * day;
  const fogCol = new THREE.Color(0xaec2d8).multiplyScalar(0.12 + 0.88 * day).lerp(new THREE.Color(0x6c7480).multiplyScalar(0.2 + 0.8 * day), rain);
  scene.fog.color.copy(fogCol); scene.fog.density = 0.00035 + 0.0024 * rain;
  const nightK = THREE.MathUtils.clamp(1 - day * 1.6, 0, 1);
  windowMats.forEach(m => { m.emissiveIntensity = nightK * 3.2; });
  headlightOn = state.lights || nightK > 0.45 || rain > 0.6;
  envDirty = true;
  $('clock').textContent = `${String(Math.floor(state.t)).padStart(2, '0')}:${String(Math.round((state.t % 1) * 60)).padStart(2, '0')}　太陽高度 ${Math.round(alt / D2R)}°`;
  { const want = rain > 0.12 ? puddleTex : null; if (road.material.roughnessMap !== want) { road.material.roughnessMap = want; road.material.needsUpdate = true; } }
  road.material.roughness = 0.93 - 0.74 * rain; road.material.color.setScalar(1 - 0.38 * rain); road.material.envMapIntensity = 0.5 + 1.6 * rain;
  rainLines.visible = rain > 0.02; rainLines.geometry.setDrawRange(0, Math.floor(RAIN_N * 2 * Math.min(1, rain * 1.1)));
  rainLines.material.opacity = 0.3 + 0.4 * rain * (0.4 + 0.6 * day);
}
function updateEnv() {
  const tmp = new THREE.Scene(); tmp.add(sky);
  const rt = pmrem.fromScene(tmp, 0, 0.1, 5000);
  scene.add(sky); if (envRT) envRT.dispose(); envRT = rt; scene.environment = rt.texture;
  envDirty = false; lastEnvAt = performance.now();
}

// ───────── 賽道：路線 → 立體路面 ─────────
setLoad('建立賽道與路面…');
const curve = new THREE.CatmullRomCurve3(track.route.map(p => new THREE.Vector3(p[0], p[2], p[1])), true, 'centripetal');
const trackLen = curve.getLength();
const N = Math.round(trackLen / 2);
const samples = curve.getSpacedPoints(N);              // 閉合：最後一點＝第一點
const tans = []; for (let i = 0; i < N; i++) { const a = samples[(i + N - 1) % N], b = samples[(i + 1) % N]; tans.push(b.clone().sub(a).normalize()); }
const ROAD_W = 10, ROAD = new THREE.Group(); scene.add(ROAD);

function canvasTex(w, h, draw, repeat) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if (repeat) t.repeat.set(...repeat); return t; }
const rnd = (() => { let s = 12345; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; })();
const asphaltTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4a4c53'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) { const v = 40 + rnd() * 60; g.fillStyle = `rgba(${v},${v},${v + 4},${0.25 + rnd() * 0.4})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 1.6, 1 + rnd() * 1.6); }
  for (const x of [0.30, 0.70]) { const gr = g.createLinearGradient((x - 0.09) * w, 0, (x + 0.09) * w, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,0.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect((x - 0.09) * w, 0, 0.18 * w, h); } // 輪胎行駛痕跡
  g.fillStyle = 'rgba(245,245,245,0.92)'; g.fillRect(0.03 * w, 0, 0.012 * w, h); g.fillRect(0.958 * w, 0, 0.012 * w, h);                                // 邊線
});
asphaltTex.repeat.set(1, 1);
const puddleTex = canvasTex(256, 256, (g, w, h) => { // 路面粗糙度：下雨時深色的地方會積水反光
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { const x = rnd() * w, y = rnd() * h, r = 14 + rnd() * 46, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(0,0,0,0.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
});
puddleTex.colorSpace = THREE.NoColorSpace;
const road = (() => {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const p = samples[i % N], t = tans[i % N], nx = -t.z, nz = t.x, l = Math.hypot(nx, nz) || 1, ax = nx / l, az = nz / l;
    pos.push(p.x - ax * ROAD_W / 2, p.y + 0.04, p.z - az * ROAD_W / 2, p.x + ax * ROAD_W / 2, p.y + 0.04, p.z + az * ROAD_W / 2);
    const v = i * (trackLen / N) / 10; uv.push(0, v, 1, v);
    if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.93, metalness: 0.0 });
  puddleTex.repeat.set(1, 0.9); puddleTex.needsUpdate = true;
  const mesh = new THREE.Mesh(g, m); mesh.receiveShadow = true; ROAD.add(mesh); return mesh;
})();
// 路肩緣石＋護牆（紅白相間）
const kerbTex = canvasTex(128, 32, (g, w, h) => { for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#f2f2f2' : '#d0021b'; g.fillRect(i * 32, 0, 32, h); } });
function wallStrip(side, off, height, tex) {
  const pos = [], uv = [], idx = [], base = [];
  for (let i = 0; i <= N; i++) {
    const p = samples[i % N], t = tans[i % N], nx = -t.z, nz = t.x, l = Math.hypot(nx, nz) || 1, x = p.x + side * nx / l * off, z = p.z + side * nz / l * off, y = p.y + 0.04;
    pos.push(x, y, z, x, y + height, z); const v = i * (trackLen / N) / 4; uv.push(0, v, 1, v);
    if (i < N) { const a = i * 2; if (side > 0) idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); else idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const t2 = tex.clone(); t2.needsUpdate = true; t2.repeat.set(1, 1);
  const m = new THREE.MeshStandardMaterial({ map: t2, roughness: 0.7, metalness: 0.0, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; mesh.receiveShadow = true; ROAD.add(mesh);
}
const wallTex = canvasTex(64, 64, (g, w, h) => { g.fillStyle = '#cfd3d9'; g.fillRect(0, 0, w, h); g.fillStyle = '#e8eaee'; g.fillRect(0, 0, w, 6); g.fillStyle = 'rgba(0,0,0,0.15)'; g.fillRect(0, h - 10, w, 10); });
wallStrip(-1, ROAD_W / 2 + 0.6, 1.0, wallTex); wallStrip(1, ROAD_W / 2 + 0.6, 1.0, wallTex);
(() => { // 路邊緣石：貼地的紅白條
  const edge = (side) => {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const p = samples[i % N], t = tans[i % N], nx = -t.z, nz = t.x, l = Math.hypot(nx, nz) || 1, ax = nx / l, az = nz / l, y = p.y + 0.06;
      pos.push(p.x + side * ax * ROAD_W / 2, y, p.z + side * az * ROAD_W / 2, p.x + side * ax * (ROAD_W / 2 + 0.6), y, p.z + side * az * (ROAD_W / 2 + 0.6));
      const v = i * (trackLen / N) / 3; uv.push(0, v, 1, v);
      if (i < N) { const a = i * 2; if (side > 0) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: kerbTex, roughness: 0.55, side: THREE.DoubleSide })); mesh.receiveShadow = true; ROAD.add(mesh);
  };
  edge(-1); edge(1);
})();

// ───────── 地面（依路線高度起伏）＋建物（OpenStreetMap 輪廓拉伸）─────────
setLoad('建立地形與建物…');
const grid = new Map(), CELL = 40;
samples.forEach((p, i) => { const k = Math.floor(p.x / CELL) + ',' + Math.floor(p.z / CELL); (grid.get(k) || grid.set(k, []).get(k)).push(p); });
const avgY = samples.reduce((a, p) => a + p.y, 0) / samples.length;
function nearest(x, z) {
  let best = null, bd = 1e12;
  for (let r = 1; r <= 8 && !best; r++) for (let cx = Math.floor(x / CELL) - r; cx <= Math.floor(x / CELL) + r; cx++) for (let cz = Math.floor(z / CELL) - r; cz <= Math.floor(z / CELL) + r; cz++) {
    const a = grid.get(cx + ',' + cz); if (!a) continue;
    for (const p of a) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < bd) { bd = d; best = p; } }
  }
  return best ? { p: best, d: Math.sqrt(bd) } : { p: { y: avgY }, d: 400 };
}
const groundY = (x, z) => { const { p, d } = nearest(x, z); return p.y - 0.4 - Math.min(26, Math.max(0, d - 8) * 0.07); };
(() => {
  const S = 1500, seg = 150, g = new THREE.PlaneGeometry(S, S, seg, seg); g.rotateX(-Math.PI / 2);
  const pp = g.attributes.position; for (let i = 0; i < pp.count; i++) pp.setY(i, groundY(pp.getX(i), pp.getZ(i)));
  g.computeVertexNormals();
  const tex = canvasTex(256, 256, (c, w, h) => { c.fillStyle = '#6f6a62'; c.fillRect(0, 0, w, h); for (let i = 0; i < 9000; i++) { const v = 70 + rnd() * 60; c.fillStyle = `rgba(${v},${v - 4},${v - 12},0.5)`; c.fillRect(rnd() * w, rnd() * h, 2, 2); } }, [60, 60]);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 })); m.receiveShadow = true; scene.add(m);
})();
const winTex = canvasTex(128, 64, (g, w, h) => { // 一層樓、兩扇窗（6 m × 3.4 m）
  g.fillStyle = '#d9d2c3'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) { g.fillStyle = '#34465a'; g.fillRect(i * 64 + 14, 12, 36, 40); g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(i * 64 + 14, 12, 36, 12); g.fillStyle = '#b9b1a2'; g.fillRect(i * 64 + 12, 52, 40, 4); }
}); winTex.repeat.set(1 / 6, 1 / 3.4);
const winEmit = canvasTex(128, 64, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); for (let i = 0; i < 2; i++) if (rnd() < 0.5) { g.fillStyle = rnd() < 0.7 ? '#ffd9a0' : '#bfe3ff'; g.fillRect(i * 64 + 14, 12, 36, 40); } }); winEmit.repeat.set(1 / 6, 1 / 3.4);
const tints = [0xffffff, 0xf3e6d2, 0xe9efe8, 0xe8ddd0, 0xf6d9b8, 0xd7dde6];
const windowMats = tints.map(c => new THREE.MeshStandardMaterial({ color: c, map: winTex, emissive: 0xffffff, emissiveMap: winEmit, emissiveIntensity: 0, roughness: 0.82, metalness: 0.05 }));
const roofMat = new THREE.MeshStandardMaterial({ color: 0x8a8d92, roughness: 0.9 });
let nBuild = 0;
for (const b of track.buildings) {
  const P = []; for (let i = 0; i < b.p.length; i += 2) P.push([b.p[i], b.p[i + 1]]);
  if (P.length < 3) continue;
  const shape = new THREE.Shape(P.map(q => new THREE.Vector2(q[0], -q[1])));
  const depth = Math.max(2.5, b.h - b.mh);
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const cx = P.reduce((s, q) => s + q[0], 0) / P.length, cz = P.reduce((s, q) => s + q[1], 0) / P.length;
  const mesh = new THREE.Mesh(geo, [roofMat, windowMats[nBuild % windowMats.length]]);

let headlightOn = false;

let s = 0.0, spin = 0;

const orbit = new OrbitControls(camera, canvas); orbit.enableDamping = true; orbit.enabled = false; orbit.maxPolarAngle = Math.PI * 0.495; orbit.minDistance = 3; orbit.maxDistance = 120;
